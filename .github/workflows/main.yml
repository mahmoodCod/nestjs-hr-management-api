name: NestJS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # فعال‌سازی کش برای npm

      - name: Install dependencies
        run: npm ci # نصب دقیق بر اساس package-lock.json

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test -- --passWithNoTests # اگر تستی نباشد، خطا ندهد

      - name: Build project
        run: npm run build
